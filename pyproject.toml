[project]
name = "neuranova-agent"
version = "0.1.0"
description = "NeuraNova personal operations agent: email triage, response-time tracking, reminders and a daily brief over WhatsApp."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neuranova = "neuranova.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
