[project]
name = "neuranova-agent"
version = "1.0.0"
description = "NeuraNova PA: personal assistant for business growth, operations, communication, quality and progress."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "tzdata>=2024.1",  # timezone database; Windows has none built in
    "openai>=1.40",
    "playwright>=1.45",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neuranova = "neuranova.cli:main"
neuranova-pa = "neuranova.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuranova = ["static/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
